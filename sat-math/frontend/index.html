<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSAT Math Forge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://dsat-math.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://dsat-math.onrender.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
        (function () {
            var api = location.host.indexOf('github.io') !== -1
                ? 'https://dsat-math.onrender.com'
                : 'http://127.0.0.1:8000'
            var signal = (typeof AbortSignal !== 'undefined' && AbortSignal.timeout)
                ? AbortSignal.timeout(90000)
                : undefined
            window.__dsatWake = fetch(api + '/health', { cache: 'no-store', mode: 'cors', signal: signal })
                .catch(function () { return null })
        })()
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
